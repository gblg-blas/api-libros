version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_libros
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mi_password_seguro
      POSTGRES_DB: db_libros
    ports:
      - "5432:5432"
    volumes:
      - pgdata_libros:/var/lib/postgresql/data

volumes:
  pgdata_libros:
  